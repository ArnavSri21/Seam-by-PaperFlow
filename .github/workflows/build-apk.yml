name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Debug & Release APKs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android SDK, Configs & Signing Keystores
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_APPLET_CONFIG_XML_BASE64: ${{ secrets.FIREBASE_APPLET_CONFIG_XML_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          # 1. Ensure Android SDK licenses & required SDK 36.1 / 36 packages
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"

          SDKMANAGER=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name "sdkmanager" 2>/dev/null | sort -V | tail -n 1 || command -v sdkmanager || true)
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" || true
          fi

          # 2. Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 3. Restore app/google-services.json from GitHub Secrets (never stored inline in workflow)
          if [ ! -f "app/google-services.json" ]; then
            if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d ' \t\r\n' | base64 -d > app/google-services.json
            elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo "::warning::GOOGLE_SERVICES_JSON_BASE64 / GOOGLE_SERVICES_JSON secret not configured; building without google-services.json."
            fi
          fi

          # 4. Restore firebase_applet_config.xml from GitHub Secrets or create blank placeholders
          mkdir -p app/src/main/res/values
          if [ ! -f "app/src/main/res/values/firebase_applet_config.xml" ]; then
            if [ -n "$FIREBASE_APPLET_CONFIG_XML_BASE64" ]; then
              echo "$FIREBASE_APPLET_CONFIG_XML_BASE64" | tr -d ' \t\r\n' | base64 -d > app/src/main/res/values/firebase_applet_config.xml
            else
              cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <resources>
              <string name="firestore_database_id" translatable="false"></string>
              <string name="recaptcha_site_key" translatable="false"></string>
          </resources>
          EOF
            fi
          fi

          # 5. Restore debug.keystore from GitHub Secrets or generate an ephemeral CI debug keystore
          if [ ! -f "debug.keystore" ] && [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 6. Restore release keystore from GitHub Secrets or create an ephemeral CI-only keystore with a random password
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > my-upload-key.jks
            echo "CI_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "CI_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            EPHEMERAL_PASS="$(openssl rand -hex 24)"
            echo "::add-mask::$EPHEMERAL_PASS"
            rm -f my-upload-key.jks
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass "$EPHEMERAL_PASS" \
              -alias upload \
              -keypass "$EPHEMERAL_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=CI Ephemeral,O=PaperFlow,C=US"
            echo "CI_STORE_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "CI_KEY_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
          fi

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ env.CI_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.CI_KEY_PASSWORD }}
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          gradle :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true -Dfile.encoding=UTF-8" \
            -Djava.awt.headless=true

          gradle :app:assembleRelease \
            -x lintVitalRelease \
            -x lintVitalAnalyzeRelease \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true -Dfile.encoding=UTF-8" \
            -Djava.awt.headless=true

          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: PaperFlow-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: PaperFlow-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APKs to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
