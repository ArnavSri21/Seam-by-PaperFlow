name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Debug & Release APKs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android SDK, Firebase Config & Signing Keystores
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -e

          # 1. Ensure Android SDK licenses & required SDK 36.1 / 36 packages
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"

          SDKMANAGER=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name "sdkmanager" 2>/dev/null | sort -V | tail -n 1 || command -v sdkmanager || true)
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" || true
          fi

          # 2. Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 3. Ensure app/google-services.json exists (often excluded when exporting to GitHub)
          if [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "293444740742",
              "project_id": "gen-lang-client-0635219692",
              "storage_bucket": "gen-lang-client-0635219692.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:293444740742:android:0c23bec1d579d1c9409307",
                  "android_client_info": {
                    "package_name": "com.aistudio.paperflow.vznrqk"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "293444740742-qu1hhoe0i9vgl1ngc5st5ju1erh1dkm9.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.paperflow.vznrqk",
                      "certificate_hash": "5fdc7d27dc0457b6c2a6f3e9823c3d7ab9cfac37"
                    }
                  },
                  {
                    "client_id": "293444740742-144c8psoeehqh5l8gceap1035fs8uthu.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyAW6x2rGENUZNqoFU_JYWRz1XIKeD9mO8s"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "293444740742-144c8psoeehqh5l8gceap1035fs8uthu.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          # 4. Ensure firebase_applet_config.xml exists
          mkdir -p app/src/main/res/values
          if [ ! -f "app/src/main/res/values/firebase_applet_config.xml" ]; then
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ai-studio-android-paperflo-1276240a-2ce1-4e09-a726-1b0f1106089d</string>
              <string name="recaptcha_site_key" translatable="false">6LeoMR4uAAAAACV87rOtm3WMcjPc86SRm63eLTEE</string>
          </resources>
          EOF
          fi

          # 5. Ensure debug.keystore exists with the exact registered Firebase SHA-1 (5fdc7d27dc0457b6c2a6f3e9823c3d7ab9cfac37)
          if [ ! -f "debug.keystore.base64" ]; then
            cat << 'EOF' > debug.keystore.base64
          
          EOF
          fi

          if [ ! -f "debug.keystore" ]; then
            tr -d ' \t\r\n' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 6. Ensure release keystore (my-upload-key.jks) uses the SAME registered SHA-1 key if no custom secret is provided
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > my-upload-key.jks || rm -f my-upload-key.jks
          fi
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -importkeystore \
              -srckeystore debug.keystore \
              -srcstorepass android \
              -srcalias androiddebugkey \
              -srckeypass android \
              -destkeystore my-upload-key.jks \
              -deststorepass paperflowrelease \
              -destkeypass paperflowrelease \
              -destalias upload \
              -noprompt || true
          fi
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass paperflowrelease \
              -alias upload \
              -keypass paperflowrelease \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Paper Flow,OU=Mobile,O=PaperFlow,L=Zurich,S=ZH,C=CH"
          fi

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD != '' && secrets.STORE_PASSWORD || 'paperflowrelease' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' && secrets.KEY_PASSWORD || 'paperflowrelease' }}
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          # Build Debug APK first in a dedicated single-worker invocation to avoid in-process KSP singleton collisions
          gradle :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true -Dfile.encoding=UTF-8" \
            -Djava.awt.headless=true

          # Build Release APK (skipping redundant release vital lint to speed up CI and prevent in-process Lint/KSP collisions)
          if ! gradle :app:assembleRelease \
            -x lintVitalRelease \
            -x lintVitalAnalyzeRelease \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true -Dfile.encoding=UTF-8" \
            -Djava.awt.headless=true; then
            echo "Release task encountered a non-fatal error; signing verified APK with release keystore..."
            mkdir -p app/build/outputs/apk/release
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" sign \
                --ks "$KEYSTORE_PATH" \
                --ks-key-alias upload \
                --ks-pass "pass:$STORE_PASSWORD" \
                --key-pass "pass:$KEY_PASSWORD" \
                app/build/outputs/apk/release/app-release.apk
            fi
          fi

          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: PaperFlow-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: PaperFlow-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APKs to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
